# Beispiel-Snippet für die bestehende nginx-Server-Konfiguration von
# stammchannel.de. Diese Datei wird nicht automatisch geladen — die
# passenden Zeilen müssen manuell in die echte Server-Konfiguration
# (z. B. /etc/nginx/sites-available/stammchannel.de) übernommen werden.

# Erlaubt größere Uploads (Musikdateien + Cover). Wert an die in
# Admin -> Einstellungen konfigurierten Limits anpassen.
client_max_body_size 100M;

# Verhindert direkten Zugriff auf hochgeladene Musik-/Cover-Dateien.
# Diese werden ausschließlich über /music/file.php (mit Login-Prüfung)
# ausgeliefert. Ersetzt die (unter nginx wirkungslose) .htaccess-Datei.
location ^~ /uploads/ {
    deny all;
    return 404;
}

# Verhindert, dass PHP-Dateien in Upload-Verzeichnissen ausgeführt werden
# könnten, falls diese Regel doch einmal umgangen wird.
location ~* ^/uploads/.*\.php$ {
    deny all;
    return 404;
}

# Verhindert direkten Zugriff auf verarbeitete StammClips-Videos. Diese
# werden ausschließlich über /clips/file.php (mit Login-Prüfung) ausgeliefert.
# Pfad an den in config/config.php konfigurierten storage.clips_path anpassen,
# falls er außerhalb des Web-Roots liegt (empfohlen) und daher ohnehin nicht
# über nginx erreichbar ist.
location ^~ /storage/ {
    deny all;
    return 404;
}

# Watch Together nutzt Server-Sent Events (watch/stream.php) für die
# Echtzeit-Synchronisation. Für diesen Endpoint muss das Proxy-/FastCGI-
# Buffering deaktiviert und der Timeout erhöht werden, sonst kommen die
# Events erst gebündelt oder die Verbindung wird zu früh gekappt.
# (Das Skript setzt zusätzlich selbst X-Accel-Buffering: no und begrenzt
# seine Laufzeit, sodass EventSource sauber reconnected.)
location = /watch/stream.php {
    include fastcgi_params;
    fastcgi_pass unix:/run/php/php-fpm.sock; # Pfad an dein Setup anpassen
    fastcgi_param SCRIPT_FILENAME $document_root/watch/stream.php;
    fastcgi_buffering off;
    fastcgi_read_timeout 120s;
    gzip off;
}

# Die StammTracker-REST-API (api/tracker.php) authentifiziert den lokalen
# Windows-Client per "Authorization: Bearer <token>". Manche PHP-FPM-Setups
# reichen diesen Header nicht automatisch durch — diese Regel stellt sicher,
# dass er als HTTP_AUTHORIZATION bei PHP ankommt.
location = /api/tracker.php {
    include fastcgi_params;
    fastcgi_pass unix:/run/php/php-fpm.sock; # Pfad an dein Setup anpassen
    fastcgi_param SCRIPT_FILENAME $document_root/api/tracker.php;
    fastcgi_param HTTP_AUTHORIZATION $http_authorization;
}


